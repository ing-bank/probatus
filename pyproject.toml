[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "probatus"
version = "3.1.5"
requires-python = ">=3.10,<3.14"
description = "Validation of regression & classifiers and data used to develop them"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "ING Bank N.V.", email = "reinier.koops@ing.com" }
]
license = { file = "LICENCE" }
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "joblib>=1.3.2",
    "typing-extensions>=4.8.0",
    "shap>=0.49.1; python_version < '3.11'",
    "shap>=0.50.0; python_version >= '3.11'",
    "numpy>=1.26.4",
]

[project.urls]
Homepage = "https://ing-bank.github.io/probatus/"
Documentation = "https://ing-bank.github.io/probatus/api/feature_elimination.html"
Repository = "https://github.com/ing-bank/probatus.git"
Changelog = "https://github.com/ing-bank/probatus/blob/main/CHANGELOG.md"

[project.optional-dependencies]


dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=2.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
    "pre-commit>=4.6.2",
    "codespell>=2.4.3",
    "ruff>=0.16.6",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    # SHAP 0.49 is the last release for Python 3.10 and cannot load XGBoost 3.1+ models.
    "xgboost>=3.0.0,<3.1; python_version < '3.11'",
    # XGBoost 3.3+ enables categorical handling by default, which SHAP 0.52 rejects for interventional explanations.
    "xgboost>=3.2.0,<3.3; python_version >= '3.11'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.8",
]

# Separating these allow for more install flexibility.
all = ["probatus[dev,docs]"]

[tool.setuptools.packages.find]
exclude = ["tests", "notebooks", "docs", "scripts"]

[tool.mypy]
# Match the running interpreter so dependency stubs use the correct Python syntax.
# Ruff still targets Python 3.10 for project code.
ignore_missing_imports = true
namespace_packages = true
pretty = true
files = ["probatus", "tests/typing"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["probatus", "probatus.*"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.setuptools.package-data]
probatus = ["py.typed"]

[tool.coverage.run]
source = ["probatus"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
force-exclude = true
# nbQA creates these temporary files while type-checking notebook and Markdown cells.
extend-exclude = ["*_nbqa_ipynb.py", "*_nbqa_md.py"]

[tool.ruff.lint]
# Syntax and Pyflakes checks, import sorting, and Python 3.10 syntax upgrades.
select = ["E4", "E7", "E9", "F", "I", "UP", "TID251"]
ignore = ["E731"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use concrete data types, protocols, generics, or typed option dictionaries."

[tool.ruff.lint.per-file-ignores]
# Public re-exports have dependency-sensitive ordering, as in the previous isort configuration.
"__init__.py" = ["I001"]
# Notebook examples deliberately introduce imports next to the cells that use them.
"*.ipynb" = ["E402"]

[tool.codespell]
skip = "**.egg-info*"
