[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "probatus"
version = "3.1.3"
requires-python = ">=3.10,<3.14"
description = "Validation of regression & classifiers and data used to develop them"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "ING Bank N.V.", email = "reinier.koops@ing.com" }
]
license = { file = "LICENCE" }
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "matplotlib>=3.8.4",
    "joblib>=1.3.2",
    "shap>=0.49.1; python_version < '3.11'",
    "shap>=0.50.0; python_version >= '3.11'",
    "numpy>=1.26.4",
    "numba>=0.60.0",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://ing-bank.github.io/probatus/"
Documentation = "https://ing-bank.github.io/probatus/api/feature_elimination.html"
Repository = "https://github.com/ing-bank/probatus.git"
Changelog = "https://github.com/ing-bank/probatus/blob/main/CHANGELOG.md"

[project.optional-dependencies]


dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyflakes>=3.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pre-commit>=4.6.2",
    "isort>=9.0.1",
    "codespell>=2.4.3",
    "ruff>=0.16.6",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    # SHAP 0.49 is the last release for Python 3.10 and cannot load XGBoost 3.1+ models.
    "xgboost>=3.0.0,<3.1; python_version < '3.11'",
    # XGBoost 3.3+ enables categorical handling by default, which SHAP 0.52 rejects for interventional explanations.
    "xgboost>=3.2.0,<3.3; python_version >= '3.11'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.8",
]

# Separating these allow for more install flexibility.
all = ["probatus[dev,docs]"]

[tool.setuptools.packages.find]
exclude = ["tests", "notebooks", "docs"]

[tool.nbqa.addopts]
# E402: Ignores imports not at the top of file for IPYNB since this makes copy-pasting easier.
ruff = ["--fix", "--ignore=E402"]
isort = ["--profile=black"]
black = ["--line-length=120"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
namespace_packages = true
pretty = true

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "mkdocs.yml", ".github", "*md", "LICENCE", ".pre-commit-config.yaml", ".gitignore"]
force-exclude = true

[tool.ruff.lint]
# D100 requires all Python files (modules) to have a "public" docstring even if all functions within have a docstring.
# D104 requires __init__ files to have a docstring
# D202 No blank lines allowed after function docstring
# D212
# D200
# D411 Missing blank line before section
# D412 No blank lines allowed between a section header and its content
# D417 Missing argument descriptions in the docstring # Only ignored because of false positve when using multiline args.
# E203
# E731 do not assign a lambda expression, use a def
# W293 blank line contains whitespace
ignore = ["D100", "D104", "D202", "D212", "D200", "E203", "E731", "W293", "D412", "D417", "D411", "RUF100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
line_length = "120"
profile = "black"
filter_files = true
extend_skip = ["__init__.py", "docs"]

[tool.codespell]
skip = "**.egg-info*"

[tool.black]
line-length = 120
