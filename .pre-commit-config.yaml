default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict # Different OSes
        name: "Check case conflict: Naming of files is compatible with all OSes"
      - id: check-docstring-first
        name: "Check docstring first: Ensures Docstring present and first"
      - id: detect-private-key
        name: "Detect private key: Prevent commit of env related keys"
      - id: trailing-whitespace
        name: "Trailing whitespace: Remove empty spaces"
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-mypy
        name: "mypy nb: Static type checking"
  - repo: local
    hooks:
      - id: mypy
        name: "mypy: Static type checking"
        entry: uv run --locked --all-extras mypy
        language: system
        require_serial: true
        types: [python]
        files: ^probatus/
  - repo: local
    hooks:
      - id: ruff-check
        name: "Ruff: Lint Python and notebooks"
        entry: uv run --locked --all-extras ruff check
        language: system
        types_or: [python, pyi, jupyter]
        args: [--fix, --no-cache]
      - id: ruff-format
        name: "Ruff: Format Python, notebooks and Markdown"
        entry: uv run --locked --all-extras ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]
        args: [--no-cache]
  - repo: local
    hooks:
      - id: codespell
        name: "codespell: Check for grammar"
        entry: uv run --locked --all-extras codespell
        language: system
        types: [python]
        args: [-L mot] # Skip the word "mot"
  - repo: local
    hooks:
      - id: shared-checks
        name: "Shared CI checks: Lint, tests and docs"
        entry: uv run --locked --all-extras python scripts/check.py
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
